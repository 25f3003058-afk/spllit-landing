# DigitalOcean App Platform spec for the Spllit API.
#
# Deploy:
#   doctl apps create --spec .do/app.yaml          # first time
#   doctl apps update <APP_ID> --spec .do/app.yaml # subsequent changes
#
# This builds backend/Dockerfile — the same image the Cloudflare Container
# config uses — so the two hosts stay interchangeable. backend/wrangler.jsonc
# is deliberately left in the repo: moving back is a redeploy, not a rewrite.
name: spllit-api

# Bangalore. The users are on Indian campuses and every authenticated request
# and every Socket.IO frame makes this round trip, so region is latency the app
# can actually feel — unlike the static frontend, which is served from an edge
# CDN regardless.
region: blr

services:
  - name: api
    # dockerfile_path is relative to the repo root; source_dir sets the build
    # context, which is what the Dockerfile's `COPY package*.json ./` resolves
    # against. Both are needed — the backend is not at the repo root.
    dockerfile_path: backend/Dockerfile
    source_dir: /backend

    github:
      repo: ankitrajchoudhari/spllit-landing
      branch: main
      # Off on purpose. The frontend and backend share this repo, so a frontend
      # commit would otherwise rebuild and restart the API — dropping every
      # Socket.IO connection for a change that never touched the server.
      deploy_on_push: false

    # Must match EXPOSE in backend/Dockerfile. App Platform also injects PORT
    # with this value, which is what src/server.ts reads.
    http_port: 8080

    # ONE INSTANCE, DELIBERATELY — the same constraint as max_instances: 1 in
    # backend/wrangler.jsonc. Socket.IO holds room membership, presence and live
    # positions in process memory, so a second instance does not share them:
    # users land on different instances and silently stop seeing each other.
    # Raising this requires a Socket.IO Redis adapter first.
    instance_count: 1

    # $5/mo, 512 MiB. The smallest paid size; App Platform has no free tier for
    # web services. Watch memory — Prisma's client is not small — and move to
    # apps-s-1vcpu-1gb-fixed if the app starts getting OOM-killed.
    instance_size_slug: apps-s-1vcpu-0.5gb

    health_check:
      http_path: /health
      port: 8080
      # The container runs prisma generate at build time, not boot, but the
      # first Mongo connection still has to be established before /health is
      # meaningful. Too short a delay here restarts a server that was merely
      # still starting, which looks like a crash loop.
      initial_delay_seconds: 30
      period_seconds: 15
      timeout_seconds: 5

    envs:
      # Non-secret configuration only. Secrets are NOT listed here — this file
      # is committed. Set them once in the App Platform dashboard
      # (Settings -> App-Level Environment Variables, type: SECRET), or with
      # `doctl apps update`; DO stores them encrypted. See DEPLOY.md for the
      # exact list.
      - key: NODE_ENV
        value: production
        scope: RUN_TIME

      - key: PORT
        value: "8080"
        scope: RUN_TIME

      # Drives the CORS allowlist in src/server.ts. If this does not exactly
      # match the browser's origin, every authenticated request fails preflight
      # and the app looks broken while the server logs nothing useful.
      - key: FRONTEND_URL
        value: https://spllit.app
        scope: RUN_TIME

      - key: JWT_EXPIRES_IN
        value: 1h
        scope: RUN_TIME

      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
        scope: RUN_TIME
